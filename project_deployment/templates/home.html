<!DOCTYPE html>
<html>
<head>
    <title>Ridge Regression Prediction</title>
    <style>
        body{
            font-family: Arial;
            background-color:#f2f2f2;
            text-align:center;
            margin-top:50px;
        }

        form{
            background:white;
            padding:30px;
            width:350px;
            margin:auto;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        input{
            width:90%;
            padding:10px;
            margin:8px;
        }

        button{
            padding:10px 20px;
            background:#4CAF50;
            color:white;
            border:none;
            cursor:pointer;
        }
    </style>
</head>

<body>

<h2>Forest Fire Prediction</h2>

<form action="{{url_for('predict_datapoint')}}" method="post">

    <input type="text" name="Temperature" placeholder="Temperature" required><br>

    <input type="text" name="RH" placeholder="Relative Humidity" required><br>

    <input type="text" name="Ws" placeholder="Wind Speed" required><br>

    <input type="text" name="Rain" placeholder="Rain" required><br>

    <input type="text" name="FFMC" placeholder="FFMC" required><br>

    <input type="text" name="DMC" placeholder="DMC" required><br>

    <input type="text" name="ISI" placeholder="ISI" required><br>

    <input type="text" name="Classes" placeholder="Classes" required><br>

    <input type="text" name="Region" placeholder="Region" required><br>
    <input type="text" name="DC" placeholder="DC">

    <button type="submit">Predict</button>

</form>

<h3>
    {{prediction_text}}
</h3>

</body>
</html>
